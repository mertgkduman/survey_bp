# Bounded canonical adaptation of Yao et al. Algorithm 1.  The source record
# remains bpgd-t001.spec.toml; this file contains only registered controls.
schema_version = 1
record_kind = "literature_policy"
variant_id = "bpgd-t001"
execution_status = "runnable"
qualification = "canonical_adaptation_not_assessed"

[source]
paper = "Yao et al., Belief Propagation Decoding of Quantum LDPC Codes with Guided Decimation"
revision = "arxiv:2312.10950v2"
url = "https://arxiv.org/pdf/2312.10950v2"
anchors = ["Sec. 4.3", "Algorithm 1", "Figure 3"]
note = "T is one flooding BP sweep per BPGD round; Algorithm 1 R=n is resolved from the validated selected artifact."

[equations]
initial_llr = "log((1-p_x)/p_x); paper Eq. (35)"
update = "binary sum-product BP; paper Eqs. (21)-(22)"
fixation = "Algorithm 1 finite signed prior of magnitude 25 after a failed BP round"

[explanations]
scope = "A bounded canonical adaptation for the common researcher command; it is not a paper-curve reproduction."
zero_bias = "Algorithm 1 and Eq. (36) differ at exactly zero posterior bias; this policy declares the positive-prior interpretation."
final_round = "The controller returns after the last fixation without adding an undeclared final BP sweep."

[unresolved]
