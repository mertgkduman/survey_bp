[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bp-registry"
version = "0.0.0"
description = "Evidence-linked QLDPC BP research platform"
requires-python = ">=3.12"
dependencies = ["numpy==2.2.6", "scipy==1.17.1", "ldpc==2.4.1", "pydantic==2.13.5"]

[project.scripts]
bp-registry = "bp_registry.study_cli:main"
bp-registry-campaign = "bp_registry.campaigns.cli:main"

[project.optional-dependencies]
performance = [
  "numba==0.64.0",
]
analysis = [
  "matplotlib==3.10.9",
  "nbformat==5.10.4",
  "nbclient==0.10.2",
  "ipykernel==6.29.5",
  "plotly==7.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
